[tool.poetry]
name = "pumptires-pending-monitor"
version = "0.1.0"
description = "PulseChain mempool listener that detects PumpTires factory createToken calls and predicts deployed token addresses."
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
web3 = "^7.0.0"
aiohttp = "^3.9.0"
aiofiles = "^24.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
orjson = "^3.9.0"
uvloop = "^0.19.0"
tenacity = "^8.0.0"
rlp = "^4.0.0"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.8.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
python-dotenv = "^1.0.0"
types-pyyaml = "^6.0.12.20250915"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
check_untyped_defs = false
disallow_subclassing_any = false
ignore_errors = false
follow_imports = "silent"
ignore_missing_imports = true
show_column_numbers = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false
warn_unreachable = false
strict_optional = false
allow_redefinition = false
implicit_reexport = false
strict = false
explicit_package_bases = false
# Disable incremental mode to prevent caching issues
incremental = false
# Explicitly disable cache to prevent any caching issues
cache_dir = "/dev/null"
# Clear the cache directory on each run
no_incremental = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: marks tests as requiring live network connection (deselect with '-m \"not live\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:web3.*",
]

